[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hiepy"
version = "0.1.0"
description = "A comprehensive PyTorch framework for Hierarchical Tucker tensors."
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "EUPL 1.2" }
authors = [
    { name = "Benedikt Schroeter", email = "b.schroeter@em.uni-frankfurt.de" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3.12",
]

# Core dependencies required to run your library
dependencies = [
    "torch>=2.6",
]

[project.optional-dependencies]
# Dependencies needed only for development, linting, and testing
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "numpy",  # silences torch's "Failed to initialize NumPy" warning
]
# Dependencies needed to build your documentation
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",    
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=10.0",   
]
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["hiepy*"]

[tool.ruff]
# Target Python version and line-length
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# E: pycodestyle errors, F: Pyflakes, ANN: Flake8-annotations (forces type hints)
select = ["E", "F", "ANN"]

[tool.ruff.lint.flake8-annotations]
# Don't require type hints for 'self' or 'cls' in classes
allow-star-arg-any = true
suppress-none-returning = true

[tool.mypy]
# Configures Mypy static type checking
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true  # Forces you to write type hints for functions

[tool.pytest.ini_options]
testpaths = ["tests", "src/hiepy", "docs"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config --doctest-modules --doctest-glob=*.md"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
]
filterwarnings = [
    "error",
    # hypothesis warns when printing a large failing input (e.g. a dense tensor); the warning must not replace the
    # actual assertion error of the failing test
    "ignore:Generating overly large repr:hypothesis.errors.HypothesisWarning",
]
# Floats in doctest outputs only need to match to the precision written in the docstring.
doctest_optionflags = ["NUMBER"]

[tool.coverage.run]
source = ["hiepy"]
branch = true

[tool.coverage.report]
# Minimum total coverage (lines and branches); pytest --cov fails below it, also in CI.
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
