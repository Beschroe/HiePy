site_name: hiepy Documentation
site_description: Hierarchical Tucker tensors in PyTorch.
site_author: Benedikt Schroeter

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - content.code.copy
    - navigation.sections
    - toc.integrate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy 
            show_root_heading: true
            show_root_toc_entry: false
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
            annotations_path: source
  - autorefs

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.arithmatex: 
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md

  - API Reference:
      - Overview: api/index.md
      - DimTree: api/dimtree.md
      - HTTensor: api/httensor.md
      - Factory: api/factory.md
      - Algebra: api/algebra.md
      - Linear Algebra: api/linalg.md
      - Transformations: api/transformations.md
      - Utils: api/utils.md