name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs of the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CPU wheels only: the default PyPI wheels on Linux pull in several GB of CUDA libraries.
  TORCH_INDEX: https://download.pytorch.org/whl/cpu
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          pip install torch --index-url "$TORCH_INDEX"
          pip install -e ".[dev]"
      - name: ruff check
        run: ruff check src/hiepy tests conftest.py
      - name: ruff format
        run: ruff format --check src/hiepy tests conftest.py
      - name: mypy
        run: mypy src/hiepy

  test:
    name: test (py${{ matrix.python }}, torch ${{ matrix.torch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
        # "min" must match the lower bound of `torch` in pyproject.toml.
        torch: ["min", "latest"]
    env:
      HYPOTHESIS_PROFILE: ci
      # One torch thread: the tests use many small tensors, for which threading only adds overhead (locally 112 s
      # with 1 thread vs. 133 s with 16, at a sixth of the CPU time) and makes run times depend on runner load.
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install torch (${{ matrix.torch }})
        run: |
          if [ "${{ matrix.torch }}" = "min" ]; then
            pip install "torch==2.6.*" --index-url "$TORCH_INDEX"
          else
            pip install torch --index-url "$TORCH_INDEX"
          fi
      - name: Install hiepy
        run: pip install -e ".[dev]"
      - name: Versions
        run: python -c "import sys, torch; print(sys.version); print('torch', torch.__version__)"
      - name: pytest (tests + doctests)
        # Slow tests run only against the latest torch.
        run: pytest --cov --cov-report=term --cov-report=xml ${{ matrix.torch == 'min' && '-m "not slow"' || '' }}
      # Coverage on the run's summary page and as a downloadable HTML report (latest torch only).
      - name: Coverage summary
        if: always() && matrix.torch == 'latest'
        run: |
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
          coverage html --fail-under=0
      - name: Upload coverage report
        if: always() && matrix.torch == 'latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          pip install torch --index-url "$TORCH_INDEX"
          pip install -e ".[docs]"
      - name: mkdocs build --strict
        run: mkdocs build --strict
