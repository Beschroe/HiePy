name: Docs

# Builds the MkDocs documentation and publishes it on GitHub Pages after every push to main.
# Pull requests are checked by the docs job in ci.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a running deployment is not cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # CPU wheels only: the default PyPI wheels on Linux pull in several GB of CUDA libraries.
  TORCH_INDEX: https://download.pytorch.org/whl/cpu
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          pip install torch --index-url "$TORCH_INDEX"
          pip install -e ".[docs]"
      - name: mkdocs build --strict
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
